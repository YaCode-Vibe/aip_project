{% extends "ad/base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm border-0">
      <div class="card-header aip-card-header">
        {{ section_label }} — {{ aerodrome.icao_code }}
      </div>
      <div class="card-body">
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label class="form-label small fw-semibold">{{ field.label }}</label>
              {{ field }}
              {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
              {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
            </div>
          {% endfor %}
          <div class="d-flex gap-2">
            <button class="btn btn-primary"><i class="bi bi-check2 me-1"></i>Save</button>
            <a class="btn btn-outline-secondary"
               href="{% url 'ad:aerodrome_detail' aerodrome.icao_code %}">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
