{# aerodrome_form.html #}
{% extends "ad/base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-10">
  <div class="card shadow-sm border-0">
    <div class="card-header aip-card-header">
      {% if object %}Edit{% else %}New{% endif %} aerodrome — AD 2.1 / AD 2.2
    </div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        <div class="row">
          {% for field in form %}
            <div class="col-md-6 mb-3">
              <label class="form-label small fw-semibold">{{ field.label }}</label>
              {{ field }}
              {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
            </div>
          {% endfor %}
        </div>
        <button class="btn btn-primary"><i class="bi bi-check2 me-1"></i>Save</button>
        <a class="btn btn-outline-secondary" href="{% url 'ad:aerodrome_list' %}">Cancel</a>
      </form>
    </div>
  </div>
</div></div>
{% endblock %}
